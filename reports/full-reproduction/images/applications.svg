ddle">control 2.789</text><text x="55" y="470" fill="#cbd5e1" font-family="sans-serif" font-size="15" text-anchor="start">Each panel is scaled to its own control; values are eight-seed held-out MSE means.</text><text x="48" y="515" fill="#64748b" font-family="sans-serif" font-size="13">HF cpu-upgrade · fixed uv command · deterministic evidence</text></svg>


