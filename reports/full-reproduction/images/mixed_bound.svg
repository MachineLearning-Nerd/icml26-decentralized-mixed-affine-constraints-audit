<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><rect width="960" height="540" fill="#0b1020"/><text x="48" y="58" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="700">The full mixed operator favors the theorem&#x27;s additive work factor</text><text x="48" y="88" fill="#94a3b8" font-family="sans-serif" font-size="15">Post-hoc fit on a formula-independent sweep; lower relative RMSE is better.</text><text x="70" y="159" fill="#cbd5e1" font-family="sans-serif" font-size="18" text-anchor="start">Paper additive factor</text><rect x="70" y="175" width="138.47096007343308" height="52" rx="8" fill="#34d399"/><text x="228.47096007343308" y="210" fill="#f8fafc" font-family="sans-serif" font-size="17" text-anchor="start">relative RMSE 0.0602</text><text x="70" y="304" fill="#cbd5e1" font-family="sans-serif" font-size="18" text-anchor="start">Multiplicative alternative</text><rect x="70" y="320" width="650.0" height="52" rx="8" fill="#fb7185"/><text x="740.0" y="355" fill="#f8fafc" font-family="sans-serif" font-size="17" text-anchor="start">relative RMSE 0.2825</text><text x="70" y="450" fill="#cbd5e1" font-family="sans-serif" font-size="17" text-anchor="start">Hard case: 221 iterations · 37,128 communications</text><text x="48" y="515" fill="#64748b" font-family="sans-serif" font-size="13">HF cpu-upgrade · fixed uv command · deterministic evidence</text></svg>


